# 硬件 profile: H200（单机 8×H200 141GB）
# NeMo-RL CLI 覆盖项，每行一个 key=value，由 NeMoRLAdapter 读取并追加到 argv。
# 卡型 pin：由 console 提交时注入 NRL_PIN_RESOURCE=accelerator_type:H200，
# Console/adapter 据此把资源角色约束到 H200 节点（异构集群精确调度）。

# H200 显存充足（141GB），可保持 TP=1 用数据并行；大模型再增大 TP
policy.dtensor_cfg.tensor_parallel_size=1
# Megatron 后端（本仓库 GRPO 默认，见 configs/base/grpo_megatron.yaml）：
policy.megatron_cfg.tensor_model_parallel_size=1
policy.megatron_cfg.pipeline_model_parallel_size=1
policy.megatron_cfg.context_parallel_size=1

policy.generation.vllm_cfg.tensor_parallel_size=1

policy.generation.colocated.enabled=true

# H200 141GB 显存充裕：相对 H100 保守档放开吞吐（对比 agent-grpo sliding-puzzle 实测）
# overrides.conf 行内不可写 # 注释，Hydra 会把整行当 override 解析
policy.megatron_cfg.activation_checkpointing=false
policy.megatron_cfg.empty_unused_memory_level=1
# Qwen3.5 + NeMo-RL v0.7 / vLLM 0.20：规避上游 CUDA-graph / Ray 间歇 hang。
policy.generation.vllm_cfg.enforce_eager=true
policy.generation.vllm_cfg.gpu_memory_utilization=0.6
policy.train_micro_batch_size=2
