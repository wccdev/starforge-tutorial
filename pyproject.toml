[project]
name = "starforge-tutorial"
version = "0.1.0"
description = "Official StarForge example project: same layout as sf init (SFT / GRPO / Agent / verl / TRL)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6", "fastapi>=0.110", "httpx>=0.27"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "gcore-pypi"
url = "https://mirrors.gcoreinc.com/repository/pypi-group/simple/"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B008"]
