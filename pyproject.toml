[project]
name = "starforge-cli"
version = "0.1.0"
description = "StarForge（星锻）命令行客户端：pip 安装后用 sf init 创建微调项目，再提交训练。"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["llm", "post-training", "rlhf", "grpo", "sft", "starforge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # 平台契约 SDK：JobSpec、recipe 目录、集群侧 launcher。
    # console / 本 CLI / 训练镜像三方共用同一份契约，彼此不再互相依赖。
    "starforge-sdk==2.1.0",
    "typer>=0.12",
    "datasets>=2.18",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/wccdev/starforge-cli"
Documentation = "https://github.com/wccdev/starforge-cli"
Repository = "https://github.com/wccdev/starforge-cli"

[project.optional-dependencies]
# 开发/CI：lint + 测试。安装：uv sync --extra dev
# fastapi/httpx 供 envkit Gym server 协议测试（训练容器自带 fastapi，无需运行时声明）。
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
# 安装后提供 `sf` 命令（类似 huggingface-cli → hf）。
sf = "starforge_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# CLI 包内含 scaffold/（sf init 模板 + launch.sh），随 wheel 分发。
packages = ["starforge_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/starforge_cli",
    "/README.md",
    "/pyproject.toml",
]

[[tool.uv.index]]
name = "gcore-pypi"
# 必须 HTTPS：HTTP 索引会被中间人替换/缓存投毒，供应链上没有「内网所以安全」。
url = "https://nexus.gcoreinc.com/repository/pypi-group/simple/"
default = true

# 本地开发精确指向同版本 SDK；构建出的 CLI wheel 只保留 ==2.1.0 元数据，
# 干净环境从上面的 Nexus 索引解析，不依赖 Git 分支。
[tool.uv.sources]
# 本地开发路径：console 仓 checkout 目录名可能是 starforge（新）或
# nemo-rl-console（旧 clone），按你的实际目录调整。
starforge-sdk = { path = "../nemo-rl-console/sdk", editable = true }

[tool.pytest.ini_options]
# 让测试能 import 仓库根的 common / starforge_cli（无需安装 common 包）。
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
# E501: 行宽交给 line-length；B008: Typer 惯用法（默认值里调用 typer.Option/Argument），非缺陷。
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# 实验入口脚本须先 sys.path.insert(REPO_ROOT) 再 import nemo_rl / common（运行时按路径访问，
# 不安装成包），故 import 不在文件顶部是有意为之——对这类入口豁免 E402。
"experiments/*/run.py" = ["E402"]
