# DeepSeek-V4-Flash-0731 · GRPO · Megatron LoRA · 8×H200
#
# 从 verl-grpo_qwen3.5-9b_qa-tools_v1 分叉：同一套题库 / Agent Loop / 检索工具 / 奖励，
# 换模型与训练后端。官方 DSv4 GRPO 只走 Megatron-Bridge + vLLM（verl #6473 / 0.9.0），
# FSDP2 + 扁平 lora_rank 对这套架构（MLA / DSA / MXFP4 MoE）不成立。
#
# 对照官方 examples/grpo_trainer/run_deepseek_v4_flash_megatron.sh：
#   官方默认 8 节点 × 8 卡、全参、lr=1e-6、PP=8、EP=8、response=10240、DAPO-Math。
#   本实验压到 1 节点 8×H200：LoRA 只训适配器，PP=1 / EP=8 才能在 world=8 上整除
#   （PP=8 且 EP=8 需要 DP≥8 → 至少 64 卡）。序列预算仍按题库 2048+2048。
#
# ★ 模型 / 数据 / 卡数不写在这里（平台权威键，adapter 排除）：
#      --model deepseek-ai/DeepSeek-V4-Flash-0731
#      --profile h200            # 整节点 8 张；写成 h200:8 也行
#      --train-dataset / --validation-dataset / --train-data / --validation-data
#      --corpus
#    绝对不要写 data.train.dataset：hydra-overrides 会原样打成
#    data.train.dataset=...，verl 的 data 没有 train 子节点，struct 启动即报错。
#
# ★ 必须靠顶层 model_engine 切后端。只改 actor.strategy 不够：
#    ppo_trainer.yaml 的 defaults 是 actor: ${model_engine}_actor，
#    默认 model_engine=dp → 仍组装 FSDP actor，megatron.* 段根本不存在。

model_engine: megatron

data:
  train_batch_size: 8
  max_prompt_length: 2048
  # 多轮（生成 + 工具回灌）共用这段预算。官方 DSv4 脚本是 10240，8 卡 LoRA 先用题库口径。
  max_response_length: 2048
  # DSv4 官方不带 jinja；模板由 common.hf_compat 在 tokenizer 加载后注入。
  # 过滤仍开着，用来丢掉套完模板后真超长的题。
  filter_overlong_prompts: true
  return_raw_chat: true
  # DSv4 官方脚本用 left；默认 error 会在超长 prompt 上直接炸掉。
  truncation: left
  dataloader_num_workers: 4
  prompt_key: prompt
  # 多轮 token 连续化。v0.9.0 官方 DSv4 脚本写 deepseekv4；auto 会按模型路径猜。
  continuous_token:
    enable: true
    model_family: deepseekv4

actor_rollout_ref:
  nccl_timeout: 3600
  model:
    trust_remote_code: true
    # 镜像 transformers 不认 deepseek_v4；先注册 AutoConfig，否则 tokenizer 加载先炸。
    external_lib: common.hf_compat
    use_fused_kernels: true
    use_remove_padding: true
    enable_gradient_checkpointing: true
    # MTP 默认关。#6473 会把 mtp_num_layers 置 0，并裁掉 HF config 给 MTP 多垫的
    # csa_compress_ratios，否则 Megatron-Bridge 会按 44 层去建。
    #
    # ⚠️ Megatron LoRA 只读嵌套 model.lora.*。扁平 lora_rank 是 FSDP 的键——
    #    源实验用扁平是因为那边是 fsdp2；这里写扁平会让 LoRA 静默失效，
    #    284B 全参在 8 卡上直接 OOM。
    # MLA（DeepSeek）不能用 linear_qkv，见 hf_model.yaml 注释。
    # DSv4 hybrid 实际模块名（14758e47）：linear_kv_proj，不是 kv_down/up；
    # CSA indexer 是 linear_wq_b / linear_weights_proj，没有 linear_wk / linear_q_proj。
    # linear_fc1/fc2 覆盖 MoE expert MLP；router 默认排除。
    lora:
      # vLLM 0.24 的 DeepseekV4ForCausalLM 还不支持 enable_lora。
      # merge=true：同步前把适配器折进基座，rollout 不传 enable_lora。
      merge: true
      rank: 32
      alpha: 64
      dropout: 0.0
      target_modules:
        - linear_q_down_proj
        - linear_q_up_proj
        - linear_kv_proj
        - linear_proj
        - linear_fc1
        - linear_fc2
        - linear_wq_b
        - linear_weights_proj
  actor:
    strategy: megatron
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 4096
    optim:
      # LoRA 比全参高 1~2 个量级。官方全参是 1e-6，照抄会几乎学不动。
      lr: 1.0e-4
      weight_decay: 0.0
      # Megatron 优化器键（verl/trainer/config/optim/megatron.yaml），
      # 不是 FSDP 的 lr_scheduler_type / min_lr_ratio。
      lr_decay_style: cosine
      lr_warmup_steps_ratio: 0.05
      min_lr: 1.0e-5
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    megatron:
      # 8 卡：TP=1 × PP=1 × CP=1 → DP=8，EP=8（EP 必须整除 DP×TP）。
      # 官方 64 卡才能 PP=8 且 EP=8。这里不要抄那条 pipeline layout。
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      virtual_pipeline_model_parallel_size: null
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
      context_parallel_size: 1
      param_offload: true
      optimizer_offload: true
      grad_offload: true
      # R3：rollout 记路由，Megatron 回放。DSv4 前 3 层是 hash-router，
      # 不对齐会把后续 MoE 层全部错位（见 docs/advance/deepseek_v4_integration）。
      router_replay:
        mode: R3
      override_transformer_config:
        # 这三项在默认 megatron.yaml 里已有。DSA 专用键不在 struct 里，
        # 必须用文件末尾的 ++ 顶层键追加，写在这里会 Hydra 启动即报错。
        recompute_method: uniform
        recompute_granularity: full
        recompute_num_layers: 1
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    megatron:
      param_offload: true
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
      context_parallel_size: 1
  rollout:
    name: vllm
    mode: async
    n: 8
    # merge=true 时 vLLM 只加载基座，适配器在 Megatron 侧折进去再同步。
    load_format: safetensors
    tensor_model_parallel_size: 1
    # vLLM MoE：EP 必须 = TP × DP。8 卡上 TP=1 → DP=8、EP=8。
    data_parallel_size: 8
    expert_parallel_size: 8
    # 权重加载后还要给 KV cache 留块。0.3 会报 No available memory for the cache blocks。
    gpu_memory_utilization: 0.5
    # #6473 重构量化权重会打坏 CUDA graph，只能 eager。
    enforce_eager: true
    enable_prefix_caching: false
    max_num_seqs: 1
    max_num_batched_tokens: 4096
    max_model_len: 4096
    calculate_log_probs: true
    enable_rollout_routing_replay: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 4096
    log_prob_micro_batch_size_per_gpu: 1
    checkpoint_engine:
      update_weights_bucket_megabytes: 512
    multi_turn:
      enable: true
      # DSv4 原生是 DSML（<｜DSML｜tool_calls>），不是 Qwen 的 hermes <tool_call>。
      # verl 0.9 的 format 枚举没有 dsml；先开 inference chat template，让模型自己的
      # encoding 注入工具。若日志里始终没有 search_docs，见 README「DSML」。
      format: hermes
      use_inference_chat_template: true
      tokenization_sanity_check_mode: ignore_strippable
      max_assistant_turns: 3
      max_tool_response_length: 900
      function_tool_path: experiments/verl-grpo_deepseek-v4-flash_qa-tools_v1/tools.py
    agent:
      default_agent_loop: tool_agent

# 两套键必须同文件：顶层给 sf validate，reward.* 才是 verl 0.9 V1 实际读的。
custom_reward_function:
  path: experiments/verl-grpo_deepseek-v4-flash_qa-tools_v1/reward.py
  name: compute_score

reward:
  custom_reward_function:
    path: experiments/verl-grpo_deepseek-v4-flash_qa-tools_v1/reward.py
    name: compute_score

algorithm:
  use_kl_in_reward: false

trainer:
  logger: [console]
  total_epochs: 1
  save_freq: 25
  test_freq: 25
  val_before_train: false

# Hydra struct 里没有的键：adapter 扁平化时路径原样保留，前缀 +/++ 才能追加。
# H200 是 SM90。DSA fusion kernel 只认 SM100+（Blackwell），开着会在
# TransformerConfig.__post_init__ 直接 assert。
"+data.apply_chat_template_kwargs.enable_thinking": true
"+actor_rollout_ref.actor.megatron.override_transformer_config.apply_dsa_kernel_fusion": false
"+actor_rollout_ref.actor.megatron.override_transformer_config.dsa_indexer_use_sparse_loss": true
"+actor_rollout_ref.actor.megatron.override_transformer_config.dsa_indexer_loss_coeff": 0.0
"+actor_rollout_ref.actor.megatron.override_transformer_config.use_fused_mhc": false
"+actor_rollout_ref.rollout.engine_kwargs.vllm.kv_cache_dtype": fp8
"+actor_rollout_ref.rollout.engine_kwargs.vllm.tokenizer_mode": deepseek_v4
"+actor_rollout_ref.rollout.engine_kwargs.vllm.reasoning_parser": deepseek_v4
"+ray_kwargs.ray_init.runtime_env.worker_process_setup_hook": common.hf_compat.ray_worker_setup
