# 题库「多轮 + 本地文档检索」Agent GRPO 实验：qwen3.5-9b 在自有技术培训考题上做强化训练。
# 继承官方单轮基底 grpo_math_1B + qwen3.5-9b 片段，只写差异。
# 奖励是自定义环境 QADocsAgentEnv（common/environments/qa_docs_agent_env.py），由本目录 run.py 实例化
# （task_name=qa_docs，读取 env.qa_docs.cfg）。最终判分复用 common/rewards 的 qa 奖励（与单轮实验同源）。
#
# ★ 对比实验【实验二 / treatment】：多轮、可调用 <search> 在集群容器内 grep 本地资料（/data/docs 下 markdown）再作答。
#   对照基线【实验一 / baseline】= grpo_qwen3.5-9b_qa-rl_v1（单轮、无工具）。
#   两者共用同一数据集 / 模型 / LoRA / batch / 裁判奖励，唯一差异是「能否多轮检索本地资料」。
#   ⚠️ 资料目录由 DOCS_DIR 控制（默认 /data/docs）；目录不存在时 <search> 返回占位提示，流程可跑通但拿不到资料。
defaults:
  - ../../configs/base/grpo_math_1B.yaml
  - ../../configs/models/qwen3.5-9b.yaml
  - ../../configs/base/grpo_megatron.yaml # Megatron-Core 后端（删此行即切回 DTensor）
  - ../../configs/base/grpo_lora.yaml # LoRA（删此行即全参数，并把 lr 写回 megatron_cfg.optimizer）
  # - ../../configs/base/grpo_noncolocated.yaml  # 非 colocated 生成（1 卡生成 / 1 卡训练；删此行即回 colocated）

# ══════════════════════════════════════════════════════════════════════════
#  调参速查 —— 你主要动【① 调参区】这几行。硬件/分布式由服务端 profile 注册表下发，不在这。
#  本实验目标集群：提交时 lab submit --profile 指定（推荐值见 README）；下列数值按该卡显存调，换卡 lab submit --profile 覆盖（通常要重调）。
#  ⚠️ 这是对比实验 treatment：batch/模型/LoRA/裁判须与 qa-rl_v1 严格一致，核心变量是「多轮+检索」。
#     注：seq 有意比 baseline 大（1536→3072）——多轮轨迹要装下「检索回灌+作答」，1536 会截断答案、反而不公平。
# ──────────────────────────────────────────────────────────────────────────
#  Reinforce++ + dynamic sampling          ★本实验的核心稳定器：见下方 grpo 注释；规避旧 GRPO 方差归一化塌缩
#  lr                                     来自 grpo_lora 基底(1e-4)；dim/alpha 本实验覆盖为 32/64
#  reference_policy_kl_penalty (loss_fn)  R++ 的 token KL 奖励锚定。过小易漂移，过大会压制检索探索
#  num_prompts_per_step × num_generations_per_prompt (grpo)  = train_global_batch_size，三者必须一致。
#                                          前者=每步看几道【不同的题】(多→梯度方向更稳)；
#                                          后者=每题采样几条(多→组内基线更准、动态采样更少被筛空)。
#                                          本实验 8×8：在总量不变的前提下把题目多样性换上来
#  max_rollout_turns / env.qa_docs.cfg.max_turns  多轮上限。⚠️ 两者【不能相等】：
#                                          env 的 max_turns 必须 = max_rollout_turns - 1，
#                                          否则 no_answer_penalty 分支永远打不到（见下方说明）。多→更吃内存
#  max_total_sequence_length (policy)     ★整条多轮轨迹(prompt+所有轮+所有检索回灌)的总预算，不是每轮。
#                                          多轮必须比 baseline 大：1536 连「搜一次+作答」都塞不下，会在写 \boxed 前被截断
#  max_num_steps / val_period (grpo)      训多久 / 多久验证一次
# ══════════════════════════════════════════════════════════════════════════

# ───────────────────────────── ① 调参区（按需改）─────────────────────────────
policy:
  # 用已完整缓存的 base 模型（与基线 qa-rl_v1 必须一致，对比才公平）。
  model_name: "Qwen/Qwen3.5-9B-Base"
  tokenizer:
    name: "Qwen/Qwen3.5-9B-Base"
  # ⚠️ 这是【整条多轮轨迹】的总预算：prompt + preamble + 所有轮生成 + 所有检索回灌，全部累加。
  #    1536（=baseline 单轮值）对多轮是错的：仅「prompt(~550)+搜一次(≤512)+回灌(~300)+作答(~512)」
  #    就 ≈1900>1536 → 在写 \boxed 前被截断 → 判 0。这正是初始 truncation_rate 0.6~0.9、准确率仅 15% 的根因。
  #    H200 有 141GB，改为 4096：完整容纳 preamble + 一次 900 字资料回灌 + 512 token 作答，给长简答留余量。
  #    不依靠无限 max_new_tokens，而是用下方 512 上限约束每轮生成，避免空洞长思考挤掉最终 \boxed{}。
  max_total_sequence_length: 4096
  # 必须 == grpo.num_prompts_per_step × num_generations_per_prompt（8×8）：
  # 动态采样就是按这个数补采样直到填满（见 nemo_rl/algorithms/grpo.py 的 train_prompts_size）。
  train_global_batch_size: 64
  generation_batch_size: 16
  # LoRA 容量：覆盖 grpo_lora 基底的 dim 8 / alpha 16（那份 base 被 8 个实验共用，不在那里改）。
  # α/r 保持 2（16/8 → 64/32），每个方向的等效步长不变，只是可用方向多 4 倍。
  # 适配器参数占 9B 的 ~0.1% → ~0.4%，显存基本无差别（train_micro_batch_size=1，
  # 全局 batch 只影响梯度累积次数、不影响峰值激活）。
  # ⚠️ 这是本次改动里把握最低的一项：本任务主要学「工具协议 + 何时该信资料」，
  #    rank 8 未必真是瓶颈。若与 dim 8 对照没有稳定增益，改回去即可。
  megatron_cfg:
    peft:
      dim: 32
      alpha: 64
  generation:
    max_new_tokens: 768 # 检索 query 很短、题库答案也短；H200 的 4096 总预算留给资料，而不是冗长生成
    temperature: 0.8 # 比 1.0 收敛更稳，又保留足够 rollout 差异让动态采样工作
    vllm_cfg:
      # NeMo-RL v0.7 已知 Qwen3.5 + vLLM CUDA-graph/Ray 间歇 hang；正式训练优先使用 eager。
      # 牺牲部分吞吐，避免数小时作业在若干 step 后 RayChannelTimeoutError。
      enforce_eager: true

grpo:
  # 8×8=64（原 4×16）：总 rollout 数和每次生成尝试的序列数都不变（8×2×8 = 4×2×16 = 128 条），
  # 但每个梯度步看到的【不同题目】数翻倍。4 道题/步太少——每步梯度方向被抽到哪 4 道题主导，
  # 线上 run 的 train/reward 逐步在 0.21~0.93 间跳，大半是这个采样噪声而非学习信号。
  # 组内 8 条对 reinforce++ 的组均值基线够用（DAPO 用 16、Search-R1 用 5，8 是常规量级）。
  # ⚠️ 代价：动态采样按 std!=0 筛组，组越小越容易整组同分被筛掉，补采样（batch_multiplier=2，
  #    即先生成 16 组填 8 组）的余量比原来紧。若日志频繁出现 dynamic sampling 达到 max_gen_batches，
  #    把 batch_multiplier 提到 3，或退回 4×16。
  num_prompts_per_step: 8
  num_generations_per_prompt: 8
  # ★ R1-Searcher 用 Reinforce++ 训练检索 Agent；它从组均值出发、再在有效 token 上全局归一化，
  #   不会像 GRPO 的 (r-μ)/σ 在 all-0 / all-1 组 σ≈0 时产生巨大 advantage、推向 mode collapse。
  adv_estimator:
    name: reinforce_plus_plus
    minus_baseline: true
  # DAPO dynamic sampling：丢弃 all-0 / all-1 的无学习信号组，补采样直到集齐 4 个成败混合组。
  # batch_multiplier=2 先生成 8 组×16 条；H200 的显存和下方短输出设置可以承担。
  use_dynamic_sampling: true
  batch_multiplier: 2
  dynamic_sampling_max_gen_batches: 8
  # v0.7：不要用达到生成上限、没有完成工具协议/答案的轨迹更新策略。
  # ⚠️ 必须与下方 advantage_clip + reward_shaping 联用，否则会复现 20260810 run
  #    (raysubmit_6UEmn8hcQtHrRKCv) 的 step103 NaN 崩溃，机理见下方 advantage_clip 注释。
  overlong_filtering: true
  # ★ 20260810 事故修复①：截断样本被 overlong_filtering 剔除后，组内有效样本会塌到 1～2 条，
  #   而 adv_estimator 仍要做归一化（除以组内 std / 有效 token 数）→ advantage 爆炸。
  #   实测该 run：num_valid_samples 58(step32)→6(step80)→1(step101)，
  #   同期 advantages/mean -0.2~-2(常态)→-66.8(step102)、min -99.3，
  #   grad_norm 0.3~0.75(step1-80)→10.6(step101)，step103 截断率撞到 1.0、有效 token 归零 → NaN：
  #     RuntimeError: iteration 103: found NaN in local grad norm for bucket #0
  #   注意 NaN 产生在 DP 通信之前、也就是【梯度裁剪之前】，所以 clip_grad=1.0 救不了，必须在
  #   advantage 层面截断。历史实验已踩过同一个坑，取同一组值。
  advantage_clip_low: -5.0
  advantage_clip_high: 5.0
  # ★ 20260810 事故修复②：advantage_clip 只防崩，不治本——真正的病根是 overlong_filtering
  #   造成的【幸存者偏差】：写超长被截断的样本全被删出梯度，模型只从"没被截断"的样本里学，
  #   于是"多搜一轮、多写一点"看起来永远只有收益、没有代价，长度就单调发散：
  #     avg_turns_per_sample  1.66(step35) → 3.00(step103，撞满 max_rollout_turns)
  #     mean_gen_tokens       446 (step35) → 1326(step103)
  #     truncation_rate       0.09(step35) → 0.98(step102) → 1.0(step103) → 有效样本归零 → NaN
  #   注意 qa_reward.py 的 FORMAT_PENALTY=-0.5（写不出 \boxed{} 的重罚）其实完全够用，
  #   问题是这个信号被 overlong_filtering 拦在梯度之外了，一次都没传到模型。
  #   DAPO 的 soft overlong punishment 正是为替代硬过滤设计的：在【还没被截断】的缓冲区内
  #   按超长程度线性扣分，这些样本仍在梯度里，模型因此能在撞墙【之前】学到"该收尾了"。
  reward_shaping:
    enabled: true
    # ⚠️ 别用基底的 ${policy.max_total_sequence_length}(=4096)：本实验的实际生成上限是
    #    max_new_tokens(768) × max_rollout_turns(3) = 2304（线上 max_gen_tokens_per_sample
    #    峰值正好=2304，可验证），总长 4096 从来不是绑定约束。填 4096 会让惩罚永不触发、
    #    整个 reward_shaping 变成静默 no-op。
    max_response_length: 2304
    # 惩罚从 2304-384=1920 开始线性加码。384 = 半轮生成的余量：
    # 健康期(step35) mean_gen 才 446，离 1920 很远、不会误伤正常长度的作答；
    # 而发散期 1326→2304 的爬升会在 1920 处就吃到递增惩罚，早于撞墙被拦下。
    overlong_buffer_length: 384
    # 基底默认 1.0 是按 DAPO 的 ±1 奖励尺度定的；本实验奖励区间约 -0.5~+1.2
    # （FORMAT_PENALTY=-0.5、检索加成 ~+0.2），0.5 与该尺度更匹配：足以压过
    # 「多搜一轮 +0.05」的诱惑，又不至于淹没最终判分本身。若首跑 truncation_rate
    # 仍在往上爬，这是第一个该加大的旋钮（0.5 → 1.0）。
    overlong_buffer_penalty: 0.5
  max_rollout_turns: 3 # 常规为「一次定向检索 + 作答」；Preamble 要求首查无结果才允许第二次
  max_num_steps: 400 # 先在纯答题验证分上观察 8 个点；动态采样使每步有效，不再盲跑 800 步
  # 50 → 25：20260810 run 的 val 只打在 0/50/100 三个点上，accuracy 0.2686(step50)→0.1045(step100)
  # 中间 50 步的劣化全程无感知，checkpointing(keep_top_k=3, metric=val:accuracy) 也只能在
  # 这三个粗点里挑。25 步一验证 → 崩坏能早一半发现，回滚点粒度也翻倍。
  # 代价：单次验证 ~280s，400 步全程多花约 37min（相对 195s/step 的总时长可忽略）。
  val_period: 25
  val_at_start: true
  val_at_end: true
  max_val_samples: 256
  val_batch_size: 64 # <= max_val_samples

loss_fn:
  # R++ 将 KL 加入 token reward（R1-Searcher 的做法），使约束参与 advantage 而不只是末端 loss。
  # 0.02 是旧 v3 的 0.01（约束过弱）与失败试验的 0.05~0.1（探索被压制）之间的保守值。
  reference_policy_kl_penalty: 0.02
  use_kl_in_reward: true

# ────────────────────────── ② 一般不动（数据 / 检索判分环境 / 日志）──────────────────────────
# run.py 读取以下键自建数据集（与 baseline 同一份题库；run.py 会在 query 前加"可检索"说明）。
data:
  shuffle: true
  input_key: query
  output_key: expected_answer
  system_prompt: null
  # 题库在集群共享盘的绝对路径（容器内可达）。私有题库不随包上传（.gitignore），故在此显式指定；
  # run.py 优先用服务端注入的环境变量 QA_RL_DATA_DIR，没有才用这里。
  data_dir: /data/datasets/qa_rl

# 自定义多轮检索判分环境；_override_ 整段替换基底的 env（math）。
env:
  _override_: true
  qa_docs:
    cfg:
      # true：简答题最终答案用裁判 LLM（需 JUDGE_* 环境变量；连不上自动回退关键词覆盖率）
      # false：全部走规则判分，零成本、无需裁判端点。与 baseline 必须一致才公平。
      use_judge: false
      # ⚠️ 必须 = grpo.max_rollout_turns - 1（3-1=2），不能等于它。
      # NeMo-RL 的 rollout 是 `for turn in range(max_rollout_turns)`，跑满就退出、不会再调一次 step()，
      # 只把样本标成 max_turns_reached，既不判分也不扣分（overlong_filtering 也只管 truncated）。
      # num_turns 每轮 +1，第 k 轮进 step() 时 num_turns == k-1，所以 max_turns=3 时
      # 「超轮不作答」分支永远不可达 →「搜 3 次不作答」净收益 = +3×0.05 = +0.15 的**正数**，
      # 比「闭卷答错」(-0.05) 还划算，是一条零风险刷分路径。设 2 后第 3 轮才会触发 -0.2。
      # 注：step() 里 boxed 分支排在超轮分支【之前】，所以第 3 轮正常作答仍会被判分，不误伤。
      max_turns: 2
      # ── 检索 reward shaping【仅训练生效】：只奖励「检索帮助答对」，不奖励“随便查到一段资料”──
      #    search_step_reward   每次「真取回资料」的即时奖励。R1-Searcher 第二阶段会移除它，防止刷检索。
      #    answer_search_bonus  「检索过且最终答对」的一次性加成（奖励靠检索拿分而非蒙）
      #    search_bonus_min_score 触发上面加成的最低 base 分。
      #      ⚠️ 别设 1.0：multiple 走 partial_penalty、fill 是「答对空数/总空数」、short 是关键词覆盖率，
      #      这三类几乎拿不到正好 1.0，而它们恰恰是最依赖检索的专有知识题；设 1.0 等于只给
      #      single/bool（闭卷就能蒙）发检索加成，激励方向反了。0.5 = 答对一半以上就认「检索有用」。
      #    search_bonus_scaled  true=加成按得分比例给（bonus×r），避免阈值处的梯度断崖
      #    no_answer_penalty    超 max_turns 仍不作答的惩罚（让「只检索不答」净收益为负，防刷分）
      # ★ 验证时这几项由 run.py 用 make_eval_cfg() 自动归零（验证环境是另一个实例）：
      #   工具使用是训练手段、不是答题正确性，算进 validation/accuracy（=mean(total_reward)）会虚高，
      #   也会让与无工具 baseline 的对比失真。所以下面的值只影响训练曲线，不影响验证分。
      # ⚠️ 若要连训练也回到纯最终判分（唯一变量=能否检索的严格对比），把下面三项全设 0。
      search_step_reward: 0.05          # 有效检索（真取回资料）即时分，别超过 0.1
      answer_search_bonus: 0.15         # 检索过且答对（≥min）才加，按得分比例
      search_bonus_min_score: 0.5
      search_bonus_scaled: true
      no_search_answer_penalty: 0.05    # ★ 关键：闭卷满分变 0.95 < 检索满分 ~1.20
      no_answer_penalty: 0.2            # 防刷检索不答（需 max_turns=2 才可达，见上）
      format_error_penalty: 0.02
      invalid_search_penalty: 0.02
      # H200 专用：默认 500 字会截掉 BM25 的后续高相关 chunk；4096 总序列预算下提高到 900。
      # 该值只覆盖本 Ray actor，不改其他实验的 DOCS_MAX_CHARS 环境变量。
      retrieval_max_chars: 900
      # ── short 题判分口径 ──────────────────────────────────────────────────
      # "boxed"：关键词覆盖率只统计 \boxed{} 内容。检索环境会把资料原文回灌给模型，
      # 若整段回答都算覆盖（"completion"，单轮 baseline 的历史行为），模型只要复述检索片段
      # 就能刷满 short 分——这是 baseline 没有的通道，且 make_eval_cfg 管不到判分口径，
      # 验证分会一起虚高、A/B 失真。⚠️ 要和 baseline 严格同口径对比时，baseline 那边
      # 也要设 QA_SHORT_SCOPE=boxed 重跑一次。
      short_answer_scope: boxed
      # ── 检索行为统计（不参与奖励，只诊断）────────────────────────────────
      # 每 N 次 step() 往作业日志打一行 `[qa_docs_stats] tag=train|val search_rate=...`。
      # search_rate（= 检索过的作答轨迹 / 全部作答轨迹）是本实验真正的过程指标：
      # 它掉到 0 就说明模型塌缩成闭卷了，而 validation/accuracy 那时照样能涨（涨的是闭卷水平）。
      stats_print_every: 20

logger:
  wandb_enabled: false
  tensorboard_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  num_val_samples_to_print: 16 # 每次验证把 16 条完整多轮对话(含检索)打印到作业日志；Web 面板分页查看
