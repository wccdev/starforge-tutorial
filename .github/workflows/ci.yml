name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: starforge-tutorial

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/starforge
          token: ${{ secrets.FORGE_REPO_TOKEN || github.token }}
          path: starforge

      - uses: astral-sh/setup-uv@v5

      - name: 示例项目测试
        working-directory: starforge-tutorial
        run: |
          uv sync --extra dev || uv sync --extra dev --index https://pypi.org/simple
          PYTHONPATH="$GITHUB_WORKSPACE/starforge/core" uv run --extra dev pytest -q

      - name: sf validate 示例实验
        working-directory: starforge-tutorial
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/starforge/core" \
            uv run --project "$GITHUB_WORKSPACE/starforge" sf validate grpo_qwen3.5-4b_gsm8k_v1
